version: 2
feature: explain-brainrot
spec: docs/superpowers/specs/2026-10-04-explain-brainrot-design.md
coverage: waived
waves:
  - id: scenebox
    slice: domain
    goal: >-
      Every scene component lays out in a box given by the composition (`SceneBox` /
      `useBox()`), and the explainer video renders the same pixels as before (spec §4.2).
    done_when: >-
      The explain unit suites pass, and the gated landscape regression renders the full
      template script (all five components) with every still within the spec §7.4
      threshold of the stills captured on `main` before the refactor.
    status: pending
    depends_on: []
    owns:
      - skills/explain/video/src/layout.tsx
      - skills/explain/video/src/scenes/
      - skills/explain/video/src/Explain.tsx (SceneBox provider for the landscape path only)
      - skills/explain/tests/test_landscape_regression.py
    risk: low
    plan: docs/superpowers/plans/2026-10-04-explain-brainrot-scenebox.md
    acceptance:
      - cd skills/explain && python3 -B -m unittest discover -s tests
      - EXPLAIN_VIDEO_E2E=1 python3 -B -m unittest tests.test_landscape_regression

  - id: sentence-narration
    slice: domain
    goal: >-
      `narrate.sh --speed` and per-sentence synthesis for a `brainrot` script write
      `audio/<id>.<engine>.words.json` with exact sentence joins (spec §5.1, §5.2); an
      explainer script narrates exactly as today.
    done_when: >-
      `test_narrate.py` passes, including the splitter, words.json and speed-cache cases
      of spec §7.2, with the existing narration cases unchanged.
    status: pending
    depends_on: []
    owns:
      - skills/explain/video/narrate.py
      - skills/explain/scripts/narrate.sh
      - skills/explain/tests/test_narrate.py
    risk: low
    plan: docs/superpowers/plans/2026-10-04-explain-brainrot-sentence-narration.md
    acceptance:
      - cd skills/explain && python3 -B -m unittest tests.test_narrate

  - id: brainrot-timeline
    slice: domain
    goal: >-
      `build-timeline.mjs` validates `format` with the per-format limits of spec §3.4 and,
      for `brainrot`, builds lead/tail 6/12, exact cue frames and caption chunks from a
      words.json fixture (spec §5.3, §5.4); explainer output is unchanged.
    done_when: >-
      `test_video_timeline.py` passes with the spec §7.1 cases, and every pre-existing
      case passes unchanged.
    status: pending
    depends_on: []
    owns:
      - skills/explain/video/build-timeline.mjs
      - skills/explain/tests/test_video_timeline.py
    risk: low
    plan: docs/superpowers/plans/2026-10-04-explain-brainrot-timeline.md
    acceptance:
      - cd skills/explain && python3 -B -m unittest tests.test_video_timeline

  - id: brainrot-render
    slice: vertical
    goal: >-
      `/explain <subject> --as brainrot` produces a checked 1080x1920 mp4 with the scene
      panel, the background (user clip or `RunnerLoop`) and word-by-word captions, plus
      the transcript with Format and Background rows (spec §3.1, §3.2, §4.3, §4.4, §6).
    done_when: >-
      All explain unit suites pass; the gated E2E renders the brainrot template once with
      the generated loop and once with the fixture clip, each with ten `ok` stage lines
      and 1080x1920 in `container`; the explainer E2E still prints its nine `ok` lines.
    status: pending
    depends_on: [scenebox, sentence-narration, brainrot-timeline]
    owns:
      - skills/explain/video/src/Explain.tsx (format switch)
      - skills/explain/video/src/types.ts
      - skills/explain/video/src/short/
      - skills/explain/video/src/scenes/BeforeAfter.tsx (stacked panels)
      - skills/explain/video/ background picker (new file)
      - skills/explain/scripts/render.sh
      - skills/explain/scripts/video-workspace.sh
      - skills/explain/video/check_render.sh
      - skills/explain/video/transcript.py
      - skills/explain/SKILL.md
      - skills/explain/rungs/brainrot.md
      - skills/explain/templates/brainrot-script.json
      - skills/explain/tests/ (background, render, check_render, transcript, workspace tests and fixtures)
    risk: high   # new stage contract in render.sh and user-supplied media decoded by Remotion
    plan: docs/superpowers/plans/2026-10-04-explain-brainrot-render.md
    acceptance:
      - cd skills/explain && python3 -B -m unittest discover -s tests
      - EXPLAIN_VIDEO_E2E=1 python3 -B -m unittest tests.test_render tests.test_check_render
      - background picker fixture cases of spec §7.3 pass

  - id: brainrot-live-run
    slice: vertical
    goal: >-
      A real subject from this repo renders as `brainrot`; the limits of spec §3.4 are
      tuned against its stills and folded back; the user accepts the video on a phone.
    done_when: >-
      `docs/superpowers/spikes/2026-10-xx-explain-brainrot-live-run.md` records the run,
      the stills read, the limit changes and their reasons; the tuned values are in
      `build-timeline.mjs`, `rungs/brainrot.md` and spec §3.4; the user states acceptance.
    status: pending
    depends_on: [brainrot-render]
    owns:
      - docs/superpowers/spikes/ (brainrot live-run note)
      - limit values in skills/explain/video/build-timeline.mjs and skills/explain/rungs/brainrot.md
      - spec §3.4 table values
    risk: low
    plan: docs/superpowers/plans/2026-10-04-explain-brainrot-live-run.md
    acceptance:
      - render.sh on the live subject prints ten ok stage lines
      - stills read with no open fault; user acceptance on a phone
deferred: []
approval:
  required: true
  reason: >-
    User rule (CLAUDE.md wave gate): the wave map needs user approval before per-wave
    planning when the feature does not fit one plan of at most 10 tasks.
