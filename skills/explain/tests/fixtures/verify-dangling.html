window.addEventListener("load", function () {
  var failures = [];
  var panels = document.querySelectorAll("section");
  for (var i = 0; i < panels.length; i++) {
    var p = panels[i];
    if (p.scrollHeight > p.clientHeight || p.scrollWidth > p.clientWidth) failures.push("OVERFLOW:" + p.id);

  document.documentElement.dataset.verify = failures.length ? failures.join(";") : "OK";
});
