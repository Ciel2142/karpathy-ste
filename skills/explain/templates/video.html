<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="explain-rung" content="video">
<title>{{title}}</title>
<!--
  explain / rung video: the transcript page. Nobody edits this file by hand.
  video/transcript.py reads script.json, fills each marker (a name in double braces)
  below, and writes out/<run>/index.html. A marker is the only dynamic part of this file.
  - Page markers: title, nav (the scene links), sections (one section for each scene).
  - Footer markers: root, kind, subject, source, commit, dirty, date, narrator, not_covered.
  - Format markers, empty for an explainer: format_rows (the Format and Background rows of a
    brainrot page, after the Narrator row) and video_class (class="portrait" on the video
    element of a brainrot page).
  One section for each scene: an h2, the narration as a paragraph, the on-screen text,
  then the cite elements of that scene. The video element stays outside every section.
  verify.sh runs three checks on the result: self-contained, citations and prose.
-->
<style>
/* Palette duplicated in page.html, sheet.html and video/src/theme.ts: change all four. */
:root {
  --ink: #1b2129;
  --muted: #5b6570;
  --line: #b8c0c9;
  --blue: #1d5fc2;
  --red: #c42f2a;
  --fill: #eef1f4;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
html, body, div, section, header, nav, main, footer, p, ul, ol, li, dl, dd, figure { font-size: 16px; }
span, strong, em, b, i, a, q, mark { font-size: inherit; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
code, pre, nav a { font-size: 15px; }
dt, cite, figcaption { font-size: 14px; }
figcaption code { font-size: 14px; }

html, body { margin: 0; padding: 0; background: #fff; }
body {
  max-width: 72ch; margin: 0 auto; padding: 0 16px 32px; color: var(--ink);
  font-family: var(--sans); line-height: 1.5; overflow-wrap: break-word;
}
h1, h2, h3, p, ul, ol, dl, dd, figure, pre { margin: 0; }
h1, h2, h3 { line-height: 1.25; }
code, pre { font-family: var(--mono); }
:not(pre) > code { padding: 0 3px; background: var(--fill); }
cite { font-family: var(--mono); font-style: normal; color: var(--blue); }
figcaption { color: var(--muted); }

header { padding: 32px 0 16px; }
video { display: block; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; background: var(--ink); }
video.portrait { aspect-ratio: 9 / 16; max-width: 405px; }
nav#toc {
  position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px 18px;
  margin-top: 16px; padding: 10px 0; background: #fff; border-bottom: 1.5px solid var(--ink);
}
nav#toc a { color: var(--blue); font-weight: 600; text-decoration: none; }
nav#toc a:hover { text-decoration: underline; }

/* One section for each scene. */
section { padding: 28px 0 8px; scroll-margin-top: 64px; }
section + section { border-top: 1px solid var(--line); }
section > * + * { margin-top: 14px; }
section ul { padding-left: 22px; }
section li + li { margin-top: 4px; }
ul.cites { list-style: none; padding: 0; }
ul.cites li + li { margin-top: 2px; }
.before-after { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.before-after > div { padding: 8px 12px; background: var(--fill); border: 1px solid var(--line); }

figure.code { border: 1px solid var(--line); }
figure.code figcaption {
  padding: 6px 12px; background: var(--fill); border-bottom: 1px solid var(--line);
}
figure.code figcaption code { padding: 0; }
figure.code pre {
  padding: 10px 12px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
  overflow-x: auto;
}

footer { margin-top: 28px; padding-top: 16px; border-top: 2px solid var(--ink); }
#provenance dl {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px;
}
#provenance dl > div {
  min-width: 0; padding: 4px 10px 6px; background: var(--fill); border: 1px solid var(--line);
}
#provenance dl > div.wide { grid-column: 1 / -1; }
#provenance dt { color: var(--muted); }
#provenance dd { overflow-wrap: anywhere; }
.not-covered { margin-top: 8px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>{{title}}</h1>
</header>

<video{{video_class}} controls src="video.mp4"></video>

<nav id="toc">{{nav}}</nav>

<main>
{{sections}}
</main>

<footer>
  <div id="provenance" data-root="{{root}}" data-kind="{{kind}}">
    <dl data-ste="skip">
      <div class="wide"><dt>Subject</dt><dd>{{subject}}</dd></div>
      <div><dt>Source</dt><dd>{{source}}</dd></div>
      <div><dt>Date</dt><dd>{{date}}</dd></div>
      <div><dt>Commit</dt><dd>{{commit}}</dd></div>
      <div><dt>Dirty</dt><dd>{{dirty}}</dd></div>
      <div><dt>Narrator</dt><dd>{{narrator}}</dd></div>{{format_rows}}
    </dl>
  </div>
  <p class="not-covered">Not covered: {{not_covered}}</p>
</footer>
</body>
</html>
